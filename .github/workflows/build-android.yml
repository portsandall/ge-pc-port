name: GEAND Android ARM64 Bootstrap

on:
  push:
    branches: [GEAND]
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'work/goldeneye-pc-port/**'
  pull_request:
    branches: [GEAND]
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'work/goldeneye-pc-port/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geand-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  ANDROID_API: 29
  ANDROID_ABI: arm64-v8a

jobs:
  android-bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout GEAND
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned NDK and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build file python3

      - name: Android arm64-v8a preflight
        run: bash android/preflight.sh

      - name: Fetch SDL2 headers
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: SDL2
          path: external/SDL
          fetch-depth: 1

      - name: Configure GE Android core objects
        shell: bash
        run: |
          mkdir -p build
          cmake -S work/goldeneye-pc-port -B build/android-core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DROMID=ntsc-final \
            -DGE_BETA_RELEASE=ON \
            -DGE_DEV_PROBES=OFF \
            -DGE_ANDROID_OBJECT_ONLY=ON \
            -DSDL2_INCLUDE_DIR="${GITHUB_WORKSPACE}/external/SDL/include" \
            2>&1 | tee build/android-configure.log

      - name: Compile GE Android core objects
        shell: bash
        run: |
          cmake --build build/android-core --target ge007_android_objects -j2 \
            2>&1 | tee build/android-compile.log

      - name: Record port baseline
        shell: bash
        run: |
          mkdir -p build/android
          {
            echo "GEAND Android bootstrap"
            echo "commit=${GITHUB_SHA}"
            echo "abi=${ANDROID_ABI}"
            echo "api=${ANDROID_API}"
            echo "ndk=${NDK_VERSION}"
            echo
            "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" --version | head -n1
            echo
            echo "Known source gates:"
            echo "- GCC/Plan-9 inherited struct semantics -> NDK Clang portability"
            echo "- Linux fixed-address/no-PIE memory model -> Android PIE/shared-library model"
            echo "- SDL2 Linux discovery -> SDL2 Android frontend"
          } | tee build/android/bootstrap.txt

      - name: Upload bootstrap report
        uses: actions/upload-artifact@v4
        with:
          name: geand-android-bootstrap
          path: build/android/bootstrap.txt
          if-no-files-found: error
